name: Plugin Security Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@a0fdf36f38fa4104d96c0e89081bd7037b34a377 # v1.2.779
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
          online: "false"
          upload_sarif: "false"
          pr_comment: "off"
          submission_enabled: "false"
          trust_repository_policy: "false"
