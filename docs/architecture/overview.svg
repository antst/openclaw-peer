<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title">
<title id="title">Processes and connections: the Sessionbus daemon on the OpenClaw host talks to the plugin inside the Gateway, which registers the sessionbus channel and dispatches each bus message into a per-sender session, and launches one worker process per lane; the worker drives an openclaw acp child and talks to the plugin over the bridge unix socket.</title>
<style>
svg{--bg:#f5f6f4;--surface:#ffffff;--ink:#1b2320;--muted:#5a655f;--line:#c4ccc7;--bus:#0d7466;--bus-tint:#e1f1ed;--oc:#b0441c;--oc-tint:#f8ebe5;--ours:#3446a8;--ours-tint:#e7eaf8}
@media (prefers-color-scheme:dark){svg{--bg:#111614;--surface:#19211e;--ink:#e2e8e4;--muted:#9ba7a1;--line:#3a4641;--bus:#45c6b2;--bus-tint:#133a33;--oc:#ee8c61;--oc-tint:#3b2219;--ours:#93a4ff;--ours-tint:#1f2750}}
text{font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.t{font-size:13.5px;font-weight:600}
.s{font-size:11.5px;fill:var(--muted)}
.l{font-size:12px}
.l.bus,.m.bus{fill:var(--bus)} .l.oc,.m.oc{fill:var(--oc)} .l.ours,.m.ours{fill:var(--ours)} .m.muted{fill:var(--muted)}
.m{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11.5px}
.host{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5}
.hostlbl{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;letter-spacing:.08em;fill:var(--muted)}
.hostlbl.oc{fill:var(--oc)}
.b-neutral{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.b-bus{fill:var(--bus-tint);stroke:var(--bus);stroke-width:1.8}
.b-oc{fill:var(--surface);stroke:var(--oc);stroke-width:1.8}
.b-ocarea{fill:var(--oc-tint);stroke:var(--oc);stroke-width:1.5}
.b-ours{fill:var(--ours-tint);stroke:var(--ours);stroke-width:2.2}
.b-note{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.frame{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 4}
.e-bus{stroke:var(--bus);stroke-width:1.8;fill:none}
.e-oc{stroke:var(--oc);stroke-width:1.8;fill:none}
.e-ours{stroke:var(--ours);stroke-width:1.8;fill:none;stroke-dasharray:6 4}
.e-ret{stroke-dasharray:5 4}
.life{stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 5}
.div{stroke:var(--line);stroke-width:1}
.fill-bus{fill:var(--bus)} .fill-oc{fill:var(--oc)} .fill-ours{fill:var(--ours)}
</style>
<defs>
<marker id="ah-bus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-bus"/></marker>
<marker id="ah-oc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-oc"/></marker>
<marker id="ah-ours" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ours"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1000" height="480" rx="10"/>
<rect class="host" x="16" y="24" width="204" height="250" rx="10"/>
<text class="hostlbl" x="32" y="46">OTHER FEDERATED HOST</text>
<rect class="b-neutral" x="36" y="64" width="164" height="52" rx="6"/>
<text class="t" x="118" y="86" text-anchor="middle">Sessionbus peer</text>
<text class="s" x="118" y="104" text-anchor="middle">e.g. claude-peer</text>
<rect class="b-bus" x="36" y="184" width="164" height="52" rx="6"/>
<text class="t" x="118" y="206" text-anchor="middle">Sessionbus daemon</text>
<text class="s" x="118" y="224" text-anchor="middle">local</text>
<line class="e-bus" x1="118" y1="116" x2="118" y2="182" marker-start="url(#ah-bus)" marker-end="url(#ah-bus)"/>
<text class="l bus" x="126" y="154">unix socket</text>
<line class="e-bus" x1="202" y1="210" x2="266" y2="210" marker-start="url(#ah-bus)" marker-end="url(#ah-bus)"/>
<text class="l bus" x="234" y="202" text-anchor="middle">federation</text>
<rect class="host" x="244" y="24" width="740" height="446" rx="10"/>
<text class="hostlbl" x="260" y="46">OPENCLAW HOST</text>
<rect class="b-bus" x="268" y="184" width="176" height="52" rx="6"/>
<text class="t" x="356" y="206" text-anchor="middle">Sessionbus daemon</text>
<text class="s" x="356" y="224" text-anchor="middle">same OS user</text>
<rect class="b-ocarea" x="544" y="64" width="420" height="276" rx="8"/>
<text class="hostlbl oc" x="560" y="86">OPENCLAW GATEWAY · NODE</text>
<rect class="b-ours" x="560" y="104" width="150" height="80" rx="6"/>
<text class="t" x="635" y="128" text-anchor="middle">plugin</text>
<text class="s" x="635" y="146" text-anchor="middle">channel sessionbus · tool</text>
<text class="s" x="635" y="164" text-anchor="middle">peer openclaw-&lt;agent&gt;</text>
<rect class="b-oc" x="830" y="104" width="118" height="80" rx="6"/>
<text class="t" x="889" y="128" text-anchor="middle">bus session</text>
<text class="s" x="889" y="146" text-anchor="middle">one per sender</text>
<text class="s" x="889" y="164" text-anchor="middle">idle: turn · busy: steer</text>
<rect class="b-oc" x="830" y="248" width="118" height="64" rx="6"/>
<text class="t" x="889" y="274" text-anchor="middle">lane session</text>
<text class="s" x="889" y="292" text-anchor="middle">worker-minted key</text>
<line class="e-oc" x1="710" y1="128" x2="828" y2="128" marker-end="url(#ah-oc)"/>
<text class="l oc" x="770" y="120" text-anchor="middle">channel dispatch</text>
<line class="e-oc" x1="830" y1="160" x2="712" y2="160" marker-end="url(#ah-oc)"/>
<text class="l oc" x="770" y="178" text-anchor="middle">tool call</text>
<polyline class="e-oc" points="830,280 660,280 660,186" marker-end="url(#ah-oc)"/>
<text class="l oc" x="745" y="272" text-anchor="middle">tool call</text>
<polyline class="e-bus" points="444,210 494,210 494,140 558,140" marker-start="url(#ah-bus)" marker-end="url(#ah-bus)"/>
<text class="l bus" x="486" y="118" text-anchor="end">message.deliver →</text>
<text class="l bus" x="486" y="134" text-anchor="end">← send · spawn · …</text>
<rect class="b-ours" x="268" y="400" width="176" height="52" rx="6"/>
<text class="t" x="356" y="422" text-anchor="middle">openclaw-peer worker</text>
<text class="s" x="356" y="440" text-anchor="middle">Go · one process per lane</text>
<line class="e-bus" x1="356" y1="238" x2="356" y2="398" marker-start="url(#ah-bus)" marker-end="url(#ah-bus)"/>
<text class="l bus" x="366" y="306">open · run · close</text>
<text class="l bus" x="366" y="322">deliver · bus actions</text>
<rect class="b-oc" x="560" y="400" width="150" height="52" rx="6"/>
<text class="t" x="635" y="422" text-anchor="middle">openclaw acp</text>
<text class="s" x="635" y="440" text-anchor="middle">child process</text>
<line class="e-oc" x1="444" y1="426" x2="558" y2="426" marker-end="url(#ah-oc)"/>
<text class="l oc" x="502" y="444" text-anchor="middle">stdio</text>
<polyline class="e-oc" points="710,426 889,426 889,314" marker-end="url(#ah-oc)"/>
<text class="l oc" x="800" y="418" text-anchor="middle">WebSocket</text>
<text class="l oc" x="800" y="444" text-anchor="middle">paired device, not admin</text>
<polyline class="e-ours" points="590,184 590,378 410,378 410,398" marker-start="url(#ah-ours)" marker-end="url(#ah-ours)"/>
<text class="l ours" x="500" y="394" text-anchor="middle">bridge socket</text>
<text class="s" x="598" y="364">settings · register · steer · actions</text>
</svg>
