<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="title">
<title id="title">Plugin inbound sequence: the daemon delivers a message, the plugin checks the dedupe ledger and limits, dispatches it into the sessionbus bus session that busSessionBinding chooses (by default one per sender name) and returns queued_for_next_turn; an idle agent starts a turn, a busy one has the message steered in; the agent replies with the sessionbus tool and the turn's final text is suppressed.</title>
<style>
svg{--bg:#f5f6f4;--surface:#ffffff;--ink:#1b2320;--muted:#5a655f;--line:#c4ccc7;--bus:#0d7466;--bus-tint:#e1f1ed;--oc:#b0441c;--oc-tint:#f8ebe5;--ours:#3446a8;--ours-tint:#e7eaf8}
@media (prefers-color-scheme:dark){svg{--bg:#111614;--surface:#19211e;--ink:#e2e8e4;--muted:#9ba7a1;--line:#3a4641;--bus:#45c6b2;--bus-tint:#133a33;--oc:#ee8c61;--oc-tint:#3b2219;--ours:#93a4ff;--ours-tint:#1f2750}}
text{font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.t{font-size:13.5px;font-weight:600}
.s{font-size:11.5px;fill:var(--muted)}
.l{font-size:12px}
.l.bus,.m.bus{fill:var(--bus)} .l.oc,.m.oc{fill:var(--oc)} .l.ours,.m.ours{fill:var(--ours)} .m.muted{fill:var(--muted)}
.m{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11.5px}
.host{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5}
.hostlbl{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;letter-spacing:.08em;fill:var(--muted)}
.hostlbl.oc{fill:var(--oc)}
.b-neutral{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.b-bus{fill:var(--bus-tint);stroke:var(--bus);stroke-width:1.8}
.b-oc{fill:var(--surface);stroke:var(--oc);stroke-width:1.8}
.b-ocarea{fill:var(--oc-tint);stroke:var(--oc);stroke-width:1.5}
.b-ours{fill:var(--ours-tint);stroke:var(--ours);stroke-width:2.2}
.b-note{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.frame{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 4}
.e-bus{stroke:var(--bus);stroke-width:1.8;fill:none}
.e-oc{stroke:var(--oc);stroke-width:1.8;fill:none}
.e-ours{stroke:var(--ours);stroke-width:1.8;fill:none;stroke-dasharray:6 4}
.e-ret{stroke-dasharray:5 4}
.life{stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 5}
.div{stroke:var(--line);stroke-width:1}
.fill-bus{fill:var(--bus)} .fill-oc{fill:var(--oc)} .fill-ours{fill:var(--ours)}
</style>
<defs>
<marker id="ah-bus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-bus"/></marker>
<marker id="ah-oc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-oc"/></marker>
<marker id="ah-ours" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ours"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1000" height="660" rx="10"/>
<rect class="b-neutral" x="20" y="20" width="140" height="48" rx="6"/>
<text class="t" x="90" y="41" text-anchor="middle">sender</text>
<text class="s" x="90" y="58" text-anchor="middle">peer or lane</text>
<rect class="b-bus" x="220" y="20" width="140" height="48" rx="6"/>
<text class="t" x="290" y="41" text-anchor="middle">daemon</text>
<text class="s" x="290" y="58" text-anchor="middle">Sessionbus</text>
<rect class="b-ours" x="430" y="20" width="140" height="48" rx="6"/>
<text class="t" x="500" y="41" text-anchor="middle">plugin</text>
<text class="s" x="500" y="58" text-anchor="middle">ledger · channel</text>
<rect class="b-oc" x="630" y="20" width="160" height="48" rx="6"/>
<text class="t" x="710" y="41" text-anchor="middle">OpenClaw</text>
<text class="s" x="710" y="58" text-anchor="middle">inbound dispatch</text>
<rect class="b-oc" x="840" y="20" width="140" height="48" rx="6"/>
<text class="t" x="910" y="41" text-anchor="middle">agent</text>
<text class="s" x="910" y="58" text-anchor="middle">bound bus session</text>
<line class="life" x1="90" y1="68" x2="90" y2="640"/>
<line class="life" x1="290" y1="68" x2="290" y2="640"/>
<line class="life" x1="500" y1="68" x2="500" y2="640"/>
<line class="life" x1="710" y1="68" x2="710" y2="640"/>
<line class="life" x1="910" y1="68" x2="910" y2="640"/>
<line class="e-bus" x1="90" y1="104" x2="288" y2="104" marker-end="url(#ah-bus)"/>
<text class="l bus" x="190" y="97" text-anchor="middle">send</text>
<line class="e-bus" x1="290" y1="136" x2="498" y2="136" marker-end="url(#ah-bus)"/>
<text class="l bus" x="395" y="129" text-anchor="middle">message.deliver</text>
<rect class="b-note" x="372" y="152" width="256" height="118" rx="5"/>
<text class="l" x="384" y="172">retransmission → original receipt</text>
<text class="l" x="384" y="190">body ≤ 64 KiB · ≤ 16 unfinished</text>
<text class="l" x="384" y="208">pair budget (loop guard)</text>
<text class="l" x="384" y="226">channel enabled (waits ≤ 10 s)</text>
<text class="l" x="384" y="244">route = this agent</text>
<text class="s" x="384" y="262">else rejected · refusals not cached</text>
<line class="e-oc" x1="500" y1="296" x2="708" y2="296" marker-end="url(#ah-oc)"/>
<text class="m oc" x="605" y="289" text-anchor="middle">inbound.dispatch</text>
<text class="s" x="605" y="314" text-anchor="middle">agent:&lt;id&gt;:sessionbus:direct:&lt;peer&gt;</text>
<line class="e-bus e-ret" x1="500" y1="342" x2="292" y2="342" marker-end="url(#ah-bus)"/>
<text class="m bus" x="395" y="335" text-anchor="middle">queued_for_next_turn</text>
<line class="e-bus e-ret" x1="290" y1="368" x2="92" y2="368" marker-end="url(#ah-bus)"/>
<text class="l bus" x="190" y="361" text-anchor="middle">receipt</text>
<rect class="frame" x="640" y="392" width="350" height="62" rx="4"/>
<text class="s" x="650" y="410">idle agent: starts a turn</text>
<text class="s" x="650" y="426">busy agent, same session: message steered</text>
<text class="s" x="650" y="442">into the running turn · text, never a command</text>
<line class="e-oc" x1="710" y1="480" x2="908" y2="480" marker-end="url(#ah-oc)"/>
<text class="l oc" x="810" y="473" text-anchor="middle">turn, message in the prompt</text>
<line class="e-oc" x1="910" y1="514" x2="502" y2="514" marker-end="url(#ah-oc)"/>
<text class="l oc" x="705" y="507" text-anchor="middle">sessionbus tool: send</text>
<line class="e-bus" x1="500" y1="544" x2="292" y2="544" marker-end="url(#ah-bus)"/>
<text class="l bus" x="395" y="537" text-anchor="middle">send</text>
<line class="e-bus" x1="290" y1="572" x2="92" y2="572" marker-end="url(#ah-bus)"/>
<text class="l bus" x="190" y="565" text-anchor="middle">message.deliver (reply)</text>
<line class="e-oc" x1="710" y1="610" x2="502" y2="610" marker-end="url(#ah-oc)"/>
<text class="m oc" x="605" y="603" text-anchor="middle">deliver(final text)</text>
<text class="s" x="490" y="628" text-anchor="end">logged as reply suppressed, sent nowhere</text>
</svg>
